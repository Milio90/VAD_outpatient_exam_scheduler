name: Build Cross-Platform Executables

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allows manual triggering

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-latest]
        
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12.3'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
   
    - name: Install Linux dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk
        
    - name: Build with PyInstaller (Windows & Linux)
      run: |
        pyinstaller --onefile --windowed --icon icons/icon.ico --name VAD_prescription_scheduler-v1.0.1-${{ matrix.os }} src/patient_prescription_gui.py
    
    - name: Upload artifacts (Windows & Linux)
      uses: actions/upload-artifact@v4
      with:
        name: VAD_prescription_scheduler-${{ matrix.os }}
        path: |
          dist/VAD_prescription_scheduler-v1.0.1-${{ matrix.os }}*

    - name: Create Release (Windows & Linux)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/VAD_prescription_scheduler-v1.0.1-${{ matrix.os }}*
        tag_name: v1.0.1
        name: Release v1.0.1
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
